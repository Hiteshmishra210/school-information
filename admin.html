<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Information Admin</title><style>
body{font-family:Arial;background:#f4f7fb;margin:0}.wrap{max-width:900px;margin:25px auto;padding:15px}.card{background:white;border-radius:14px;padding:22px;box-shadow:0 3px 15px #0001}label{font-weight:700;display:block;margin:12px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}button{padding:11px 17px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:15px}.msg{margin-top:12px;padding:11px;border-radius:8px;word-break:break-word}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#991b1b}.link{margin-top:10px;padding:12px;background:#f8fafc;border-radius:8px;word-break:break-all}</style></head><body><div class="wrap"><div class="card"><h1>School Information – Admin</h1>
<label>Admin PIN</label><input id="pin" type="password" value="1234">
<label>सूचना का नाम</label><input id="name" placeholder="Teacher Information">
<label>Columns – एक line में एक</label><textarea id="cols" rows="7" placeholder="S.No
Teacher Name
Designation
Subject
Mobile Number"></textarea>
<label>Schools – एक line में एक</label><textarea id="schools" rows="10" placeholder="School 1
School 2
School 3"></textarea>
<button onclick="createForm()">Create Form</button><div id="msg"></div></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCkC_KkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec",SCHOOL_URL="PUT_YOUR_SCHOOL_HTML_URL_HERE";
const $=x=>document.getElementById(x);
function show(t,ok){$("msg").className="msg "+(ok?"ok":"err");$("msg").innerHTML=t}
async function createForm(){try{show("Form बनाया जा रहा है...",true);let u=new URL(API);u.searchParams.set("action","createForm");u.searchParams.set("pin",$("pin").value.trim());u.searchParams.set("name",$("name").value.trim());u.searchParams.set("columns",$("cols").value.trim());u.searchParams.set("schools",$("schools").value.trim());let d=await (await fetch(u)).json();if(!d.ok)throw Error(d.error);let link=SCHOOL_URL+"?form="+encodeURIComponent(d.formId);show("✓ Form बन गया।<div class='link'>"+link+"</div>",true)}catch(e){show("Error: "+e.message)}}
</script></body></html>
