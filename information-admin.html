<!doctype html>
<html lang="hi">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Information Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
}

.wrap{
  max-width:900px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 4px 20px #0002;
}

h1{
  color:#2563eb;
  margin-top:0;
  font-size:30px;
}

h2{
  margin-top:25px;
}

label{
  display:block;
  font-weight:700;
  margin:15px 0 7px;
  font-size:17px;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
  font-family:Arial,sans-serif;
}

textarea{
  resize:vertical;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.99);
}

.test{
  background:#0f766e;
}

.next{
  background:#16a34a;
}

.msg{
  display:none;
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  word-break:break-word;
}

.ok{
  display:block;
  background:#ecfdf5;
  color:#166534;
}

.err{
  display:block;
  background:#fef2f2;
  color:#991b1b;
}

.info{
  margin-top:20px;
  padding:18px;
  border-radius:12px;
  background:#fff7ed;
  color:#9a3412;
  line-height:1.7;
}

.result{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:12px;
  background:#eff6ff;
}

.formid{
  background:white;
  padding:12px;
  border-radius:8px;
  word-break:break-all;
  margin-top:10px;
}

</style>

</head>


<body>

<div class="wrap">

<div class="card">

<h1>📋 Information Admin</h1>


<label>Admin PIN</label>

<input
  id="pin"
  type="password"
  value="1234"
  placeholder="Admin PIN"
>


<label>Information Name</label>

<input
  id="infoName"
  placeholder="जैसे - Topper Information"
>


<label>Column Names</label>

<textarea
  id="columns"
  rows="7"
  placeholder="Student Name
Father Name
Marks
Percentage
Rank"
></textarea>


<label>School Names</label>

<textarea
  id="schools"
  rows="10"
  placeholder="School 1
School 2
School 3"
></textarea>


<button
  class="test"
  onclick="testAPI()"
>
🔎 Test Google API
</button>


<button
  onclick="createInformationForm()"
>
➕ Create Information Form
</button>


<div id="msg" class="msg"></div>


<div id="result" class="result">

<h2>✅ Information Form तैयार है</h2>

<p>
Form ID:
</p>

<div id="formId"
     class="formid">
</div>


<button
  class="next"
  onclick="openInformationForm()"
>
➡️ Information Entry खोलें
</button>

</div>


<div class="info">

<b>ध्यान दें:</b>

<br>

• Information Name ऊपर डालें।

<br>

• Columns एक-एक line में डालें।

<br>

• Schools एक-एक line में डालें।

<br>

• Duplicate School/Column अपने आप हटेंगे।

<br>

• Form बनने के बाद अगला Information Entry page खुलेगा।

</div>


</div>

</div>


<script>


/* ==========================================
   GOOGLE APPS SCRIPT API
========================================== */

const API =
"https://script.google.com/macros/s/AKfycbyHb8abCXCQFAhemdCEcoHEo2gx3JL5eq_-X558SQITZXOiJ_ocCnVymLItAB2m2Pr5/exec";


/* ==========================================
   MESSAGE
========================================== */

function showMsg(text,type){

  const box =
    document.getElementById("msg");

  box.className =
    "msg " + type;

  box.innerText =
    text;

}


/* ==========================================
   JSONP API CALL
   fetch() की जगह यह mobile friendly तरीका है
========================================== */

function callAPI(params){

  return new Promise(function(resolve,reject){

    const callbackName =
      "googleCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*100000);


    const script =
      document.createElement("script");


    let finished = false;


    window[callbackName] =
      function(data){

        if(finished) return;

        finished = true;

        cleanup();

        resolve(data);

      };


    function cleanup(){

      try{
        document.body.removeChild(script);
      }catch(e){}

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName] = undefined;
      }

    }


    const query =
      new URLSearchParams(params);


    query.set(
      "callback",
      callbackName
    );


    script.src =
      API + "?" + query.toString();


    script.onerror =
      function(){

        if(finished) return;

        finished = true;

        cleanup();

        reject(
          new Error(
            "Google API connection failed"
          )
        );

      };


    document.body.appendChild(script);


    setTimeout(function(){

      if(finished) return;

      finished = true;

      cleanup();

      reject(
        new Error(
          "Google API response नहीं मिला"
        )
      );

    },15000);


  });

}


/* ==========================================
   TEST API
========================================== */

function testAPI(){

  showMsg(
    "Google API check हो रही है...",
    "ok"
  );


  callAPI({
    action:""
  })

  .then(function(data){

    console.log(data);


    if(data && data.ok){

      showMsg(
        "✅ Google API सही काम कर रही है।",
        "ok"
      );

    }

    else{

      showMsg(
        "❌ API Error: " +
        (data.error || "Unknown error"),
        "err"
      );

    }

  })

  .catch(function(error){

    showMsg(
      "❌ " + error.message,
      "err"
    );

  });

}


/* ==========================================
   CREATE INFORMATION FORM
========================================== */

function createInformationForm(){

  const pin =
    document.getElementById("pin")
      .value.trim();


  const infoName =
    document.getElementById("infoName")
      .value.trim();


  const columns =
    document.getElementById("columns")
      .value.trim();


  const schools =
    document.getElementById("schools")
      .value.trim();


  if(!pin){

    showMsg(
      "Admin PIN डालें",
      "err"
    );

    return;
  }


  if(!infoName){

    showMsg(
      "Information Name डालें",
      "err"
    );

    return;
  }


  if(!columns){

    showMsg(
      "Column Names डालें",
      "err"
    );

    return;
  }


  if(!schools){

    showMsg(
      "School Names डालें",
      "err"
    );

    return;
  }


  showMsg(
    "⏳ Information Form बनाया जा रहा है...",
    "ok"
  );


  document.getElementById("result")
    .style.display="none";


  callAPI({

    action:"createInfoForm",

    pin:pin,

    infoName:infoName,

    columns:columns,

    schools:schools

  })

  .then(function(data){

    console.log(data);


    if(!data || !data.ok){

      showMsg(
        "❌ Error: " +
        ((data && data.error)
          ? data.error
          : "Unknown error"),
        "err"
      );

      return;
    }


    const formId =
      data.formId;


    /* Form ID save */

    document.getElementById("formId")
      .innerText =
      formId;


    /* Result दिखाओ */

    document.getElementById("result")
      .style.display =
      "block";


    showMsg(
      "✅ Information Form successfully create हो गया।",
      "ok"
    );


    /* Save current form ID */

    localStorage.setItem(
      "informationFormId",
      formId
    );


    localStorage.setItem(
      "informationInfoName",
      infoName
    );


  })

  .catch(function(error){

    showMsg(
      "❌ Google API connection failed: " +
      error.message,
      "err"
    );

  });

}


/* ==========================================
   OPEN INFORMATION ENTRY
========================================== */

function openInformationForm(){

  const formId =
    document.getElementById("formId")
      .innerText.trim();


  if(!formId){

    showMsg(
      "Form ID नहीं मिला",
      "err"
    );

    return;
  }


  /*
    information.html इसी folder में होना चाहिए
  */

  const base =
    window.location.href
      .substring(
        0,
        window.location.href.lastIndexOf("/") + 1
      );


  const url =
    base +
    "information.html?form=" +
    encodeURIComponent(formId);


  window.location.href =
    url;

}


</script>

</body>

</html>
