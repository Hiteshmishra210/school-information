<!doctype html>
<html lang="hi">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Information Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  color:#17202a;
}

.wrap{
  max-width:900px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin-top:0;
  color:#173b75;
}

label{
  font-weight:700;
  display:block;
  margin:12px 0 6px;
}

input,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  font-family:Arial,sans-serif;
}

textarea{
  resize:vertical;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  margin-top:12px;
}

.blue{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.gray{
  background:#e2e8f0;
  color:#111;
}

.msg{
  padding:11px;
  margin-top:12px;
  border-radius:8px;
  word-break:break-word;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

.result{
  margin-top:15px;
  padding:15px;
  background:#f8fafc;
  border-radius:10px;
  display:none;
}

.success{
  color:#166534;
  font-weight:bold;
}

@media(max-width:600px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:15px;
    border-radius:10px;
  }

  h1{
    font-size:22px;
  }

  button{
    width:100%;
    margin:5px 0;
  }

}

</style>

</head>


<body>


<div class="wrap">

<div class="card">


<h1>
Information Entry – Admin
</h1>


<label>
Admin PIN
</label>

<input
  id="pin"
  type="password"
  value="1234"
  placeholder="Admin PIN">


<label>
सूचना का नाम
</label>

<input
  id="infoName"
  type="text"
  placeholder="जैसे - Topper Information">


<label>
Columns – एक line में एक
</label>

<textarea
  id="columns"
  rows="8"
  placeholder="S.No
Student Name
Father Name
Marks
Percentage
Rank"></textarea>


<label>
Schools – एक line में एक
</label>

<textarea
  id="schools"
  rows="12"
  placeholder="School 1
School 2
School 3
School 4"></textarea>


<button
  class="blue"
  onclick="createInfoForm()">

➕ Create Information Form

</button>


<button
  class="gray"
  onclick="clearForm()">

Clear

</button>


<div id="msg"></div>


<div id="result"
     class="result">

  <div class="success">
    ✅ Information Form Successfully Created
  </div>

  <br>

  <div>
    <b>Information Name:</b>
    <span id="resultName"></span>
  </div>

  <br>

  <div>
    <b>Form ID:</b>
    <span id="resultId"></span>
  </div>

  <br>

  <div>
    Google Sheet में नई sheet तैयार हो गई है।
  </div>

</div>


</div>

</div>


<script>


/* =================================================
   GOOGLE APPS SCRIPT API
   ================================================= */

const API =
"https://script.google.com/macros/s/AKfycbyHb8abCXCQFAhemdCEcoHEo2gx3JL5eq_-X558SQITZXOiJ_ocCnVymLItAB2m2Pr5/exec";


/* =================================================
   ELEMENT SHORTCUT
   ================================================= */

const $ = id =>
document.getElementById(id);


/* =================================================
   MESSAGE
   ================================================= */

function showMsg(text,type){

  const box = $("msg");

  box.className = "msg " + type;

  box.textContent = text;

}


/* =================================================
   JSONP API CALL
   ================================================= */

function apiCall(action, params = {}){

  return new Promise(function(resolve,reject){

    const callbackName =
      "jsonpCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    let url =
      API +
      "?action=" +
      encodeURIComponent(action);


    Object.keys(params).forEach(function(key){

      url +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          params[key]
        );

    });


    url +=
      "&callback=" +
      callbackName;


    const script =
      document.createElement("script");


    let finished = false;


    const timer =
      setTimeout(function(){

        if(finished) return;

        finished = true;

        cleanup();

        reject(
          new Error(
            "Google API से response नहीं मिला"
          )
        );

      },20000);


    function cleanup(){

      clearTimeout(timer);

      if(script.parentNode){

        script.parentNode.removeChild(
          script
        );

      }

      try{

        delete window[callbackName];

      }
      catch(e){}

    }


    window[callbackName] =
      function(data){

        if(finished) return;

        finished = true;

        cleanup();

        resolve(data);

      };


    script.onerror =
      function(){

        if(finished) return;

        finished = true;

        cleanup();

        reject(
          new Error(
            "Google API Connection Failed"
          )
        );

      };


    script.src = url;

    document.body.appendChild(script);

  });

}


/* =================================================
   CREATE INFORMATION FORM
   ================================================= */

async function createInfoForm(){

  const pin =
    $("pin").value.trim();


  const infoName =
    $("infoName").value.trim();


  const columns =
    $("columns").value.trim();


  const schools =
    $("schools").value.trim();


  /* VALIDATION */

  if(!pin){

    showMsg(
      "Admin PIN डालें",
      "err"
    );

    return;

  }


  if(!infoName){

    showMsg(
      "Information Name डालें",
      "err"
    );

    return;

  }


  if(!columns){

    showMsg(
      "Columns डालें",
      "err"
    );

    return;

  }


  if(!schools){

    showMsg(
      "Schools की list डालें",
      "err"
    );

    return;

  }


  showMsg(
    "Information Form बनाया जा रहा है...",
    "loading"
  );


  $("result").style.display =
    "none";


  try{


    const data =
      await apiCall(
        "createInfoForm",
        {

          pin:pin,

          infoName:infoName,

          columns:columns,

          schools:schools

        }
      );


    console.log(
      "CREATE INFORMATION RESPONSE:",
      data
    );


    if(!data || !data.ok){

      throw new Error(
        data && data.error
          ? data.error
          : "Information Form create नहीं हुआ"
      );

    }


    /* SUCCESS */

    showMsg(
      "✓ Information Form successfully create हो गया।",
      "ok"
    );


    $("resultName").textContent =
      infoName;


    $("resultId").textContent =
      data.formId || "-";


    $("result").style.display =
      "block";


  }

  catch(error){

    console.error(
      "INFORMATION API ERROR:",
      error
    );


    showMsg(
      "Google API Connection Failed: " +
      error.message,
      "err"
    );

  }

}


/* =================================================
   CLEAR
   ================================================= */

function clearForm(){

  $("infoName").value = "";

  $("columns").value = "";

  $("schools").value = "";

  $("msg").className = "";

  $("msg").textContent = "";

  $("result").style.display =
    "none";

}


/* =================================================
   START
   ================================================= */

</script>


</body>

</html>
