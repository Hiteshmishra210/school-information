<!doctype html>
<html lang="hi">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Information Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
}

.wrap{
  max-width:900px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:22px;
  box-shadow:0 3px 15px #0001;
}

h1{
  color:#2456d3;
  margin-top:0;
}

label{
  font-weight:700;
  display:block;
  margin:14px 0 6px;
}

input,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px;
  font-family:Arial,sans-serif;
}

textarea{
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  opacity:.9;
}

.create{
  background:#2563eb;
}

.copy{
  background:#16a34a;
}

.test{
  background:#128577;
}

.msg{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  word-break:break-word;
  line-height:1.5;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.info{
  background:#fff7ed;
  color:#9a3412;
  margin-top:20px;
}

.result{
  display:none;
  margin-top:20px;
  padding:15px;
  background:#f8fafc;
  border-radius:10px;
}

.link{
  margin-top:10px;
  padding:12px;
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
  word-break:break-all;
}

</style>

</head>


<body>

<div class="wrap">

<div class="card">

<h1>📋 Information Admin</h1>


<label>Admin PIN</label>

<input
  id="pin"
  type="password"
  value="1234"
  placeholder="Admin PIN"
>


<label>Information Name</label>

<input
  id="infoName"
  type="text"
  placeholder="जैसे: Teacher Information"
>


<label>📝 Column Names</label>

<textarea
  id="columns"
  rows="7"
  placeholder="Teacher Name
Father Name
Designation
Subject
Mobile Number"
></textarea>


<label>🏫 School Names</label>

<textarea
  id="schools"
  rows="10"
  placeholder="School 1
School 2
School 3"
></textarea>


<!-- TEST -->

<button
  class="test"
  onclick="testAPI()"
>
🔎 Test Google API
</button>


<!-- CREATE -->

<button
  class="create"
  onclick="createInformationForm()"
>
➕ Create Information Form
</button>


<div id="msg"></div>


<div
  id="result"
  class="result"
>

<h3>✅ Information Form तैयार हो गया</h3>

<div class="link">

<b>Information Form Link:</b>

<br><br>

<span id="formLink"></span>

</div>


<button
  class="copy"
  onclick="copyLink()"
>
📋 Copy Link
</button>

</div>


<div class="msg info">

<b>ध्यान दें:</b>

<br><br>

• Information Name डालें।<br>
• Columns एक-एक line में डालें।<br>
• Schools एक-एक line में डालें।<br>
• Duplicate School/Column अपने आप हटेंगे।<br>
• Form बनने के बाद अगली Information Form screen खुलेगी।

</div>


</div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT API
   ===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbyHb8abCXCQFAhemdCEcoHEo2gx3JL5eq_-X558SQITZXOiJ_ocCnVymLItAB2m2Pr5/exec";


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,type){

  const box =
    document.getElementById("msg");

  box.className =
    "msg " + type;

  box.innerText =
    text;
}


/* =====================================================
   TEST API
   ===================================================== */

function testAPI(){

  showMessage(
    "Google API test हो रहा है...",
    "ok"
  );


  const url =
    API +
    "?action=test";


  fetch(url)

  .then(function(response){

    if(!response.ok){

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(data){

    console.log(
      "Google API Response:",
      data
    );


    if(data && data.ok){

      showMessage(
        "✅ Google API सही काम कर रही है।",
        "ok"
      );

    }

    else{

      showMessage(
        "❌ Google API Error: " +
        (
          data && data.error
          ? data.error
          : "Unknown error"
        ),
        "err"
      );

    }

  })

  .catch(function(error){

    console.error(
      "API ERROR:",
      error
    );

    showMessage(
      "❌ Google API connection failed.\n\n" +
      error.message,
      "err"
    );

  });

}


/* =====================================================
   CREATE INFORMATION FORM
   ===================================================== */

function createInformationForm(){

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  const infoName =
    document
      .getElementById("infoName")
      .value
      .trim();


  const columns =
    document
      .getElementById("columns")
      .value
      .trim();


  const schools =
    document
      .getElementById("schools")
      .value
      .trim();


  /* VALIDATION */

  if(!pin){

    showMessage(
      "Admin PIN डालें।",
      "err"
    );

    return;
  }


  if(!infoName){

    showMessage(
      "Information Name डालें।",
      "err"
    );

    return;
  }


  if(!columns){

    showMessage(
      "Columns डालें।",
      "err"
    );

    return;
  }


  if(!schools){

    showMessage(
      "Schools की list डालें।",
      "err"
    );

    return;
  }


  showMessage(
    "Information Form बनाया जा रहा है...",
    "ok"
  );


  /* =================================================
     API URL
     ================================================= */

  const url =
    API +
    "?action=createInfoForm" +
    "&pin=" +
    encodeURIComponent(pin) +
    "&infoName=" +
    encodeURIComponent(infoName) +
    "&columns=" +
    encodeURIComponent(columns) +
    "&schools=" +
    encodeURIComponent(schools);


  console.log(
    "API URL:",
    url
  );


  /* =================================================
     SAME FETCH METHOD AS WORKING ADMIN.HTML
     ================================================= */

  fetch(url)

  .then(function(response){

    if(!response.ok){

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(data){

    console.log(
      "Google API Response:",
      data
    );


    if(!data){

      showMessage(
        "❌ Google API से response नहीं मिला।",
        "err"
      );

      return;
    }


    if(!data.ok){

      showMessage(
        "❌ Error: " +
        (
          data.error ||
          "Unknown Google API Error"
        ),
        "err"
      );

      return;
    }


    /* SUCCESS */

    showMessage(
      "✅ Information Form successfully create हो गया।",
      "ok"
    );


    const formId =
      data.formId;


    /*
      Current GitHub Pages location
    */

    const base =
      window.location.origin +
      window.location.pathname
        .replace(
          "information-admin.html",
          ""
        );


    /*
      अगली Information Entry Screen
    */

    const formURL =
      base +
      "information.html?form=" +
      encodeURIComponent(formId);


    document
      .getElementById("formLink")
      .innerText =
      formURL;


    document
      .getElementById("result")
      .style.display =
      "block";


    /*
      अगर तुम चाहते हो कि form बनते ही
      अगला page खुले तो नीचे वाली line
      uncomment कर सकते हो।

      window.location.href = formURL;
    */

  })


  .catch(function(error){

    console.error(
      "GOOGLE API ERROR:",
      error
    );


    showMessage(
      "❌ Google API connection failed.\n\n" +
      error.message,
      "err"
    );

  });

}


/* =====================================================
   COPY LINK
   ===================================================== */

function copyLink(){

  const link =
    document
      .getElementById("formLink")
      .innerText;


  if(!link){

    alert(
      "पहले Information Form बनाएं।"
    );

    return;
  }


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(link)

      .then(function(){

        alert(
          "Information Form Link copy हो गया ✅"
        );

      })

      .catch(function(){

        alert(
          "Copy नहीं हुआ। Link manually copy करें।"
        );

      });

  }

  else{

    alert(
      "Link को manually copy करें।"
    );

  }

}

</script>

</body>

</html>
