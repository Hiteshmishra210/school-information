<!doctype html>
<html lang="hi">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Information Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  padding:20px;
}

.wrap{
  max-width:900px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:14px;
  padding:22px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin-top:0;
  color:#173b75;
}

label{
  font-weight:700;
  display:block;
  margin:14px 0 6px;
}

input,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  font-family:Arial;
}

textarea{
  resize:vertical;
}

button{
  padding:13px 20px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  opacity:.9;
}

.msg{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  text-align:center;
  padding:30px;
  font-size:18px;
  color:#555;
}

/* FORM PAGE */

#formPage{
  display:none;
}

.formTitle{
  color:#173b75;
  margin-top:0;
}

.tableWrap{
  overflow-x:auto;
  margin-top:20px;
  border:1px solid #ddd;
  border-radius:8px;
}

table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
}

th{
  background:#173b75;
  color:white;
  padding:10px;
  border:1px solid #ddd;
  white-space:nowrap;
}

td{
  padding:6px;
  border:1px solid #ddd;
}

td.school{
  font-weight:bold;
  background:#f8fafc;
  white-space:nowrap;
}

td input{
  width:100%;
  min-width:130px;
  padding:9px;
  border:1px solid #cbd5e1;
  border-radius:6px;
}

.submitBox{
  margin-top:20px;
  text-align:center;
}

.submitBtn{
  background:#16a34a;
  min-width:220px;
}

.backBtn{
  background:#64748b;
  margin-left:8px;
}

</style>

</head>


<body>


<!-- =========================
ADMIN PAGE
========================= -->

<div id="adminPage">

<div class="wrap">

<div class="card">

<h1>📋 Information Admin</h1>

<label>Admin PIN</label>

<input
id="pin"
type="password"
value="1234"
placeholder="Admin PIN">


<label>सूचना का नाम</label>

<input
id="infoName"
placeholder="जैसे - Teacher Information">


<label>Columns – एक line में एक</label>

<textarea
id="columns"
rows="7"
placeholder="S.No
Teacher Name
Designation
Subject
Mobile Number"></textarea>


<label>Schools – एक line में एक</label>

<textarea
id="schools"
rows="10"
placeholder="School 1
School 2
School 3"></textarea>


<button onclick="createInformation()">
➕ Submit & Open Information Form
</button>


<div id="adminMsg" class="msg"></div>

</div>

</div>

</div>



<!-- =========================
INFORMATION FORM PAGE
========================= -->

<div id="formPage">

<div class="wrap">

<div class="card">

<h1 class="formTitle" id="formTitle">
Information Form
</h1>

<p>
हर School की information सामने वाले columns में भरें।
</p>


<div id="formLoading" class="loading">
Form तैयार हो रहा है...
</div>


<div id="tableArea" style="display:none">

<div class="tableWrap">

<table>

<thead id="tableHead">
</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>


<div class="submitBox">

<button
class="submitBtn"
onclick="submitInformation()">
✅ Submit Information
</button>

<button
class="backBtn"
onclick="backToAdmin()">
⬅️ Back
</button>

</div>

</div>


<div id="formMsg" class="msg"></div>

</div>

</div>

</div>



<script>


/* ==================================================
GOOGLE APPS SCRIPT API
================================================== */

const API =
"https://script.google.com/macros/s/AKfycbyHb8abCXCQFAhemdCEcoHEo2gx3JL5eq_-X558SQITZXOiJ_ocCnVymLItAB2m2Pr5/exec";


/* ==================================================
CURRENT FORM DATA
================================================== */

let currentForm = null;


/* ==================================================
MESSAGE
================================================== */

function showAdminMsg(text,type){

  const box =
    document.getElementById("adminMsg");

  box.style.display = "block";

  box.className =
    "msg " + type;

  box.innerText = text;

}


function showFormMsg(text,type){

  const box =
    document.getElementById("formMsg");

  box.style.display = "block";

  box.className =
    "msg " + type;

  box.innerText = text;

}


/* ==================================================
CREATE INFORMATION FORM
================================================== */

function createInformation(){

  const pin =
    document.getElementById("pin")
    .value
    .trim();


  const infoName =
    document.getElementById("infoName")
    .value
    .trim();


  const columns =
    document.getElementById("columns")
    .value
    .trim();


  const schools =
    document.getElementById("schools")
    .value
    .trim();


  /* VALIDATION */

  if(!pin){

    showAdminMsg(
      "Admin PIN डालें",
      "err"
    );

    return;
  }


  if(!infoName){

    showAdminMsg(
      "सूचना का नाम डालें",
      "err"
    );

    return;
  }


  if(!columns){

    showAdminMsg(
      "Columns डालें",
      "err"
    );

    return;
  }


  if(!schools){

    showAdminMsg(
      "Schools की list डालें",
      "err"
    );

    return;
  }


  showAdminMsg(
    "Information Form बनाया जा रहा है...",
    "ok"
  );


  /* ==================================================
  API URL
  ================================================== */

  const url =
    API +
    "?action=createInfoForm" +
    "&pin=" +
    encodeURIComponent(pin) +
    "&infoName=" +
    encodeURIComponent(infoName) +
    "&columns=" +
    encodeURIComponent(columns) +
    "&schools=" +
    encodeURIComponent(schools) +
    "&callback=infoCreateCallback";


  /* ==================================================
  JSONP
  Mobile friendly
  ================================================== */

  callJSONP(
    url,
    "infoCreateCallback"
  );

}


/* ==================================================
CREATE CALLBACK
================================================== */

function infoCreateCallback(data){

  if(!data){

    showAdminMsg(
      "Google API से response नहीं मिला",
      "err"
    );

    return;
  }


  if(!data.ok){

    showAdminMsg(
      "Error: " +
      (data.error || "Unknown error"),
      "err"
    );

    return;
  }


  /*
    Form successfully create हो गया।
    अब कोई link generate नहीं करना।
    सीधे next page/form खोलना है।
  */

  currentFormId =
    data.formId;


  const pin =
    document.getElementById("pin")
    .value
    .trim();


  /* ADMIN PAGE HIDE */

  document.getElementById(
    "adminPage"
  ).style.display = "none";


  /* FORM PAGE SHOW */

  document.getElementById(
    "formPage"
  ).style.display = "block";


  document.getElementById(
    "formLoading"
  ).style.display = "block";


  document.getElementById(
    "tableArea"
  ).style.display = "none";


  /* FORM LOAD */

  loadInformationForm(
    currentFormId
  );

}


/* ==================================================
FORM ID
================================================== */

let currentFormId = "";


/* ==================================================
LOAD INFORMATION FORM
================================================== */

function loadInformationForm(formId){

  const url =
    API +
    "?action=getInfoForm" +
    "&formId=" +
    encodeURIComponent(formId) +
    "&callback=infoFormCallback";


  callJSONP(
    url,
    "infoFormCallback"
  );

}


/* ==================================================
FORM CALLBACK
================================================== */

function infoFormCallback(data){

  document.getElementById(
    "formLoading"
  ).style.display = "none";


  if(!data){

    showFormMsg(
      "Google API से response नहीं मिला",
      "err"
    );

    return;
  }


  if(!data.ok){

    showFormMsg(
      "Error: " +
      (data.error || "Form नहीं मिला"),
      "err"
    );

    return;
  }


  currentForm =
    data.form;


  /* TITLE */

  document.getElementById(
    "formTitle"
  ).innerText =
    "📋 " +
    currentForm.infoName;


  /* TABLE */

  buildTable(
    currentForm
  );


  document.getElementById(
    "tableArea"
  ).style.display = "block";

}


/* ==================================================
BUILD TABLE
================================================== */

function buildTable(form){

  const head =
    document.getElementById(
      "tableHead"
    );


  const body =
    document.getElementById(
      "tableBody"
    );


  head.innerHTML = "";

  body.innerHTML = "";


  /* HEADER */

  const headerRow =
    document.createElement("tr");


  const schoolHeader =
    document.createElement("th");

  schoolHeader.innerText =
    "School Name";


  headerRow.appendChild(
    schoolHeader
  );


  form.columns.forEach(
    function(column){

      const th =
        document.createElement("th");

      th.innerText =
        column;

      headerRow.appendChild(
        th
      );

    }
  );


  head.appendChild(
    headerRow
  );


  /* SCHOOL ROWS */

  form.schools.forEach(
    function(school, schoolIndex){

      const tr =
        document.createElement("tr");


      /* SCHOOL NAME */

      const schoolCell =
        document.createElement("td");

      schoolCell.className =
        "school";

      schoolCell.innerText =
        school;


      tr.appendChild(
        schoolCell
      );


      /* COLUMNS */

      form.columns.forEach(
        function(column,columnIndex){

          const td =
            document.createElement("td");


          const input =
            document.createElement("input");


          input.type =
            "text";


          input.className =
            "infoInput";


          input.dataset.school =
            school;


          input.dataset.schoolIndex =
            schoolIndex;


          input.dataset.columnIndex =
            columnIndex;


          input.placeholder =
            column;


          td.appendChild(
            input
          );


          tr.appendChild(
            td
          );

        }
      );


      body.appendChild(
        tr
      );

    }
  );

}


/* ==================================================
SUBMIT INFORMATION
================================================== */

function submitInformation(){

  if(!currentForm){

    showFormMsg(
      "Form उपलब्ध नहीं है",
      "err"
    );

    return;
  }


  const data = [];


  /*
    हर School की row बनाना
  */

  currentForm.schools.forEach(
    function(school,schoolIndex){

      const values = [];


      currentForm.columns.forEach(
        function(column,columnIndex){

          const input =
            document.querySelector(
              'input[data-school-index="' +
              schoolIndex +
              '"][data-column-index="' +
              columnIndex +
              '"]'
            );


          values.push(
            input
              ? input.value.trim()
              : ""
          );

        }
      );


      data.push({

        school:
          school,

        values:
          values

      });

    }
  );


  /* CHECK */

  let hasData = false;


  data.forEach(
    function(row){

      row.values.forEach(
        function(value){

          if(
            String(value).trim() !== ""
          ){

            hasData = true;

          }

        }
      );

    }
  );


  if(!hasData){

    showFormMsg(
      "कम से कम एक information भरें",
      "err"
    );

    return;
  }


  showFormMsg(
    "Information Google Sheet में save हो रही है...",
    "ok"
  );


  /*
    Current admin PIN
  */

  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  /*
    JSON string
  */

  const dataText =
    JSON.stringify(data);


  /*
    JSONP URL
  */

  const url =
    API +
    "?action=submitInfo" +
    "&pin=" +
    encodeURIComponent(pin) +
    "&formId=" +
    encodeURIComponent(currentFormId) +
    "&data=" +
    encodeURIComponent(dataText) +
    "&callback=infoSubmitCallback";


  callJSONP(
    url,
    "infoSubmitCallback"
  );

}


/* ==================================================
SUBMIT CALLBACK
================================================== */

function infoSubmitCallback(data){

  if(!data){

    showFormMsg(
      "Google API से response नहीं मिला",
      "err"
    );

    return;
  }


  if(!data.ok){

    showFormMsg(
      "Error: " +
      (data.error || "Information save नहीं हुई"),
      "err"
    );

    return;
  }


  showFormMsg(
    "✅ सभी Information Google Sheet में successfully save हो गई।",
    "ok"
  );


  /*
    थोड़ी देर बाद confirmation
  */

  setTimeout(
    function(){

      alert(
        "✅ Information successfully save हो गई।"
      );

    },
    300
  );

}


/* ==================================================
JSONP FUNCTION
================================================== */

function callJSONP(url,callbackName){

  /*
    पुरानी script हटाएँ
  */

  const old =
    document.getElementById(
      "jsonpScript"
    );


  if(old){

    old.remove();

  }


  /*
    नई script
  */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    "jsonpScript";


  script.src =
    url;


  script.async =
    true;


  script.onerror =
    function(){

      /*
        API connection failure
      */

      const adminPage =
        document.getElementById(
          "adminPage"
        );


      if(
        adminPage.style.display !== "none"
      ){

        showAdminMsg(
          "Google API Connection failed. कृपया Apps Script deployment check करें।",
          "err"
        );

      }
      else{

        showFormMsg(
          "Google API Connection failed. कृपया Apps Script deployment check करें।",
          "err"
        );

      }

    };


  document.body.appendChild(
    script
  );

}


/* ==================================================
BACK
================================================== */

function backToAdmin(){

  document.getElementById(
    "formPage"
  ).style.display = "none";


  document.getElementById(
    "adminPage"
  ).style.display = "block";


  document.getElementById(
    "formMsg"
  ).style.display = "none";

}

</script>

</body>
</html>
