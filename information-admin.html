<!doctype html>
<html lang="hi">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Information Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 4px 20px #0002;
}

h1{
  margin-top:0;
  color:#2563eb;
  font-size:30px;
}

h2{
  color:#173b75;
  margin-top:25px;
}

label{
  display:block;
  font-weight:700;
  margin:15px 0 7px;
  font-size:17px;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
  font-family:Arial,sans-serif;
}

textarea{
  resize:vertical;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.99);
}

.test{
  background:#0f766e;
}

.create{
  background:#2563eb;
}

.submit{
  background:#16a34a;
}

.clear{
  background:#dc2626;
}

.msg{
  display:none;
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  word-break:break-word;
}

.ok{
  display:block;
  background:#ecfdf5;
  color:#166534;
}

.err{
  display:block;
  background:#fef2f2;
  color:#991b1b;
}

.entry{
  display:none;
  margin-top:25px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid #ddd;
  border-radius:10px;
}

table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
  background:white;
}

th{
  background:#2563eb;
  color:white;
  padding:12px;
  border:1px solid #ddd;
  white-space:nowrap;
}

td{
  padding:8px;
  border:1px solid #ddd;
  vertical-align:middle;
}

td:first-child{
  font-weight:bold;
  background:#f8fafc;
  min-width:180px;
}

td input{
  width:100%;
  min-width:150px;
  padding:10px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#f8fafc;
}

.info{
  margin-top:20px;
  padding:18px;
  border-radius:12px;
  background:#fff7ed;
  color:#9a3412;
  line-height:1.7;
}

.small{
  color:#64748b;
  font-size:14px;
}

@media(max-width:600px){

  .wrap{
    padding:10px;
  }

  .card{
    padding:18px;
  }

  h1{
    font-size:27px;
  }

  button{
    font-size:16px;
  }

}

</style>

</head>


<body>


<div class="wrap">

<div class="card">


<h1>📋 Information Admin</h1>


<!-- ================================
     CREATE SECTION
================================ -->

<div id="createSection">


<label>Admin PIN</label>

<input
  id="pin"
  type="password"
  value="1234"
  placeholder="Admin PIN"
>


<label>Information Name</label>

<input
  id="infoName"
  placeholder="जैसे - Topper Information"
>


<label>Column Names</label>

<textarea
  id="columns"
  rows="7"
  placeholder="Student Name
Father Name
Marks
Percentage
Rank"
></textarea>


<label>School Names</label>

<textarea
  id="schools"
  rows="10"
  placeholder="School 1
School 2
School 3"
></textarea>


<button
  class="test"
  onclick="testAPI()"
>
🔎 Test Google API
</button>


<button
  class="create"
  onclick="createInformationForm()"
>
➕ Create Information Form
</button>


<div id="msg" class="msg"></div>


<div class="info">

<b>ध्यान दें:</b>

<br>

• Information Name डालें।

<br>

• Columns एक-एक line में डालें।

<br>

• Schools एक-एक line में डालें।

<br>

• Create करने के बाद इसी page पर Information Entry खुल जाएगी।

<br>

• कोई अलग link generate नहीं होगा।

</div>

</div>


<!-- ================================
     INFORMATION ENTRY
================================ -->

<div id="entrySection" class="entry">


<h2 id="entryTitle">
📊 Information Entry
</h2>


<div class="small">
नीचे सभी Schools के सामने information भरें।
</div>


<div class="table-wrap">

<table id="entryTable">

<thead id="tableHead"></thead>

<tbody id="tableBody"></tbody>

</table>

</div>


<div id="entryMsg" class="msg"></div>


<button
  class="submit"
  onclick="submitAllInformation()"
>
✅ Submit All Information
</button>


<button
  class="clear"
  onclick="startNewForm()"
>
🔄 Create New Information
</button>


</div>


</div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbyHb8abCXCQFAhemdCEcoHEo2gx3JL5eq_-X558SQITZXOiJ_ocCnVymLItAB2m2Pr5/exec";


/* =====================================================
   CURRENT FORM DATA
===================================================== */

let currentForm = null;

let currentFormId = "";


/* =====================================================
   MESSAGE
===================================================== */

function showMsg(text,type){

  const box =
    document.getElementById("msg");

  box.className =
    "msg " + type;

  box.innerText =
    text;

}


function showEntryMsg(text,type){

  const box =
    document.getElementById("entryMsg");

  box.className =
    "msg " + type;

  box.innerText =
    text;

}


/* =====================================================
   JSONP API
   Mobile friendly
===================================================== */

function callAPI(params){

  return new Promise(function(resolve,reject){

    const callbackName =
      "googleCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*100000);


    const script =
      document.createElement("script");


    let finished = false;


    window[callbackName] =
      function(data){

        if(finished) return;

        finished = true;

        cleanup();

        resolve(data);

      };


    function cleanup(){

      try{
        script.remove();
      }catch(e){}

      try{
        delete window[callbackName];
      }catch(e){

        window[callbackName] =
          undefined;

      }

    }


    const query =
      new URLSearchParams();


    Object.keys(params).forEach(function(key){

      query.set(
        key,
        params[key]
      );

    });


    query.set(
      "callback",
      callbackName
    );


    script.src =
      API + "?" + query.toString();


    script.onerror =
      function(){

        if(finished) return;

        finished = true;

        cleanup();

        reject(
          new Error(
            "Google API connection failed"
          )
        );

      };


    document.body.appendChild(script);


    setTimeout(function(){

      if(finished) return;

      finished = true;

      cleanup();

      reject(
        new Error(
          "Google API response नहीं मिला"
        )
      );

    },15000);

  });

}


/* =====================================================
   TEST GOOGLE API
===================================================== */

function testAPI(){

  showMsg(
    "Google API check हो रही है...",
    "ok"
  );


  callAPI({
    action:""
  })

  .then(function(data){

    console.log(data);


    if(data && data.ok){

      showMsg(
        "✅ Google API सही काम कर रही है।",
        "ok"
      );

    }

    else{

      showMsg(
        "❌ API Error: " +
        (data && data.error
          ? data.error
          : "Unknown error"),
        "err"
      );

    }

  })

  .catch(function(error){

    showMsg(
      "❌ " + error.message,
      "err"
    );

  });

}


/* =====================================================
   CREATE INFORMATION FORM
===================================================== */

function createInformationForm(){

  const pin =
    document.getElementById("pin")
      .value.trim();


  const infoName =
    document.getElementById("infoName")
      .value.trim();


  const columns =
    document.getElementById("columns")
      .value.trim();


  const schools =
    document.getElementById("schools")
      .value.trim();


  if(!pin){

    showMsg(
      "Admin PIN डालें",
      "err"
    );

    return;

  }


  if(!infoName){

    showMsg(
      "Information Name डालें",
      "err"
    );

    return;

  }


  if(!columns){

    showMsg(
      "Column Names डालें",
      "err"
    );

    return;

  }


  if(!schools){

    showMsg(
      "School Names डालें",
      "err"
    );

    return;

  }


  showMsg(
    "⏳ Information Form बनाया जा रहा है...",
    "ok"
  );


  callAPI({

    action:"createInfoForm",

    pin:pin,

    infoName:infoName,

    columns:columns,

    schools:schools

  })

  .then(function(data){

    console.log(
      "CREATE RESPONSE:",
      data
    );


    if(!data || !data.ok){

      showMsg(
        "❌ Error: " +
        (
          data && data.error
            ? data.error
            : "Unknown error"
        ),
        "err"
      );

      return;

    }


    currentFormId =
      data.formId;


    /*
       Create के बाद
       उसी form की जानकारी
       सीधे API से लेते हैं।
    */

    return callAPI({

      action:"getInfoForm",

      formId:currentFormId

    });

  })

  .then(function(data){

    if(!data) return;


    if(!data.ok){

      showMsg(
        "❌ Form load नहीं हुआ: " +
        (
          data.error ||
          "Unknown error"
        ),
        "err"
      );

      return;

    }


    currentForm =
      data.form;


    /*
       अब उसी page पर
       Information Entry दिखाओ
    */

    showInformationEntry(
      currentForm
    );


    showMsg(
      "✅ Form तैयार है। नीचे information भरें।",
      "ok"
    );

  })

  .catch(function(error){

    showMsg(
      "❌ Google API connection failed: " +
      error.message,
      "err"
    );

  });

}


/* =====================================================
   SHOW INFORMATION ENTRY
===================================================== */

function showInformationEntry(form){

  const entrySection =
    document.getElementById(
      "entrySection"
    );


  const createSection =
    document.getElementById(
      "createSection"
    );


  /*
     Title
  */

  document.getElementById(
    "entryTitle"
  ).innerText =
    "📊 " +
    form.infoName +
    " - Information Entry";


  /*
     TABLE HEADER
  */

  const thead =
    document.getElementById(
      "tableHead"
    );


  thead.innerHTML =
    "";


  const headerRow =
    document.createElement("tr");


  const schoolHeader =
    document.createElement("th");


  schoolHeader.innerText =
    "School Name";


  headerRow.appendChild(
    schoolHeader
  );


  form.columns.forEach(function(column){

    const th =
      document.createElement("th");


    th.innerText =
      column;


    headerRow.appendChild(
      th
    );

  });


  thead.appendChild(
    headerRow
  );


  /*
     TABLE BODY
  */

  const tbody =
    document.getElementById(
      "tableBody"
    );


  tbody.innerHTML =
    "";


  form.schools.forEach(function(school){

    const tr =
      document.createElement("tr");


    /*
       SCHOOL NAME
    */

    const schoolTd =
      document.createElement("td");


    schoolTd.innerText =
      school;


    tr.appendChild(
      schoolTd
    );


    /*
       COLUMNS
    */

    form.columns.forEach(function(column,index){

      const td =
        document.createElement("td");


      const input =
        document.createElement("input");


      input.type =
        "text";


      input.placeholder =
        column;


      input.dataset.school =
        school;


      input.dataset.columnIndex =
        index;


      td.appendChild(
        input
      );


      tr.appendChild(
        td
      );

    });


    tbody.appendChild(
      tr
    );

  });


  /*
     CREATE SECTION छुपाओ
  */

  createSection.style.display =
    "none";


  /*
     ENTRY दिखाओ
  */

  entrySection.style.display =
    "block";


  /*
     ऊपर scroll
  */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   SUBMIT ALL INFORMATION
===================================================== */

function submitAllInformation(){

  if(!currentForm){

    showEntryMsg(
      "Form data उपलब्ध नहीं है।",
      "err"
    );

    return;

  }


  const tbody =
    document.getElementById(
      "tableBody"
    );


  const rows =
    tbody.querySelectorAll("tr");


  const data = [];


  rows.forEach(function(tr){

    const firstCell =
      tr.querySelector("td");


    if(!firstCell) return;


    const school =
      firstCell.innerText.trim();


    const inputs =
      tr.querySelectorAll(
        "input"
      );


    const values = [];


    inputs.forEach(function(input){

      values.push(
        input.value.trim()
      );

    });


    data.push({

      school:school,

      values:values

    });

  });


  /*
     Check whether at least
     one information is filled
  */

  let hasData = false;


  data.forEach(function(row){

    row.values.forEach(function(value){

      if(
        String(value).trim() !== ""
      ){

        hasData = true;

      }

    });

  });


  if(!hasData){

    showEntryMsg(
      "कम से कम एक information भरें।",
      "err"
    );

    return;

  }


  showEntryMsg(
    "⏳ Information Google Sheet में save हो रही है...",
    "ok"
  );


  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  callAPI({

    action:"submitInfo",

    pin:pin,

    formId:currentFormId,

    data:JSON.stringify(data)

  })

  .then(function(response){

    console.log(
      "SUBMIT RESPONSE:",
      response
    );


    if(!response || !response.ok){

      showEntryMsg(
        "❌ Error: " +
        (
          response && response.error
            ? response.error
            : "Unknown error"
        ),
        "err"
      );

      return;

    }


    showEntryMsg(
      "✅ सभी Information Google Sheet में successfully save हो गई।",
      "ok"
    );

  })

  .catch(function(error){

    showEntryMsg(
      "❌ Google API connection failed: " +
      error.message,
      "err"
    );

  });

}


/* =====================================================
   CREATE NEW FORM
===================================================== */

function startNewForm(){

  currentForm =
    null;

  currentFormId =
    "";


  document.getElementById(
    "entrySection"
  ).style.display =
    "none";


  document.getElementById(
    "createSection"
  ).style.display =
    "block";


  document.getElementById(
    "msg"
  ).innerHTML =
    "";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

</script>

</body>

</html>
