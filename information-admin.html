<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Information Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  padding:15px;
}

.wrap{
  max-width:1000px;
  margin:auto;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 4px 18px #0002;
  margin-bottom:15px;
}

h1{
  margin-top:0;
  color:#173b75;
  font-size:25px;
}

h2{
  color:#173b75;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,textarea,select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}

textarea{
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  margin-top:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:hover{
  opacity:.9;
}

.green{
  background:#16a34a;
}

.black{
  background:#334155;
}

.red{
  background:#dc2626;
}

.msg{
  margin-top:12px;
  padding:11px;
  border-radius:8px;
  display:none;
}

.ok{
  background:#dcfce7;
  color:#166534;
}

.err{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#dbeafe;
  color:#1e40af;
}

.tableBox{
  overflow-x:auto;
  margin-top:20px;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:700px;
}

th,td{
  border:1px solid #cbd5e1;
  padding:7px;
  text-align:left;
}

th{
  background:#e2e8f0;
  font-weight:bold;
}

td:first-child{
  font-weight:bold;
  background:#f8fafc;
  white-space:nowrap;
}

td input{
  min-width:130px;
}

.topInfo{
  background:#eff6ff;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
}

.hidden{
  display:none;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:140px;
}

@media(max-width:600px){

  body{
    padding:8px;
  }

  .card{
    padding:15px;
    border-radius:12px;
  }

  h1{
    font-size:22px;
  }

  button{
    width:100%;
  }

  .actions{
    display:block;
  }

  .actions button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>📋 Information Admin</h1>

<label>Admin PIN</label>
<input id="pin" type="password" value="1234">

<label>Information Name</label>
<input id="infoName"
       placeholder="जैसे - Topper Information">

<label>Columns</label>
<textarea id="columns"
rows="7"
placeholder="Topper Name
Father Name
Marks
Percentage
School Rank"></textarea>

<label>School Names</label>
<textarea id="schools"
rows="10"
placeholder="School 1
School 2
School 3"></textarea>

<button onclick="createForm()">
➕ Create Information Form
</button>

<div id="msg" class="msg"></div>

</div>


<!-- ENTRY AREA -->

<div id="entryCard" class="card hidden">

<h2 id="formTitle"></h2>

<div class="topInfo">
<b>कुल Schools:</b>
<span id="schoolCount"></span>
</div>

<div class="tableBox">

<table id="entryTable">

<thead></thead>

<tbody></tbody>

</table>

</div>

<div class="actions">

<button class="green"
onclick="submitInformation()">
💾 Submit & Save
</button>

<button class="black"
onclick="printTable()">
🖨️ Print
</button>

</div>

<div id="saveMsg" class="msg"></div>

</div>

</div>


<script>

/* =================================================
   IMPORTANT:
   यही तुम्हारा नया Information Apps Script URL है
================================================= */

const API =
"https://script.google.com/macros/s/AKfycbyHb8abCXCQFAhemdCEcoHEo2gx3JL5eq_-X558SQITZXOiJ_ocCnVymLItAB2m2Pr5/exec";


let CURRENT_FORM_ID = "";

let CURRENT_FORM = null;


/* =================================================
   MESSAGE
================================================= */

function showMsg(id,text,type){

  const box=document.getElementById(id);

  box.className="msg "+type;

  box.innerText=text;

  box.style.display="block";
}


/* =================================================
   JSONP CALL
   fetch() नहीं है
   इसलिए mobile में CORS problem नहीं होगी
================================================= */

function apiCall(params,callback){

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.floor(Math.random()*10000);


  window[callbackName] = function(data){

    try{
      callback(data);
    }
    finally{

      delete window[callbackName];

      const script =
        document.getElementById(callbackName);

      if(script){
        script.remove();
      }

    }

  };


  const query =
    Object.keys(params)
    .map(function(key){

      return encodeURIComponent(key)
        + "="
        + encodeURIComponent(params[key]);

    })
    .join("&");


  const script =
    document.createElement("script");


  script.id = callbackName;

  script.src =
    API +
    "?" +
    query +
    "&callback=" +
    callbackName;


  script.onerror=function(){

    delete window[callbackName];

    script.remove();

    showMsg(
      "msg",
      "Google API से connection नहीं हो पाया।",
      "err"
    );

  };


  document.body.appendChild(script);
}


/* =================================================
   CREATE FORM
================================================= */

function createForm(){

  const pin =
    document.getElementById("pin").value.trim();

  const infoName =
    document.getElementById("infoName")
    .value.trim();

  const columns =
    document.getElementById("columns")
    .value.trim();

  const schools =
    document.getElementById("schools")
    .value.trim();


  if(!pin){

    showMsg(
      "msg",
      "Admin PIN डालें",
      "err"
    );

    return;
  }


  if(!infoName){

    showMsg(
      "msg",
      "Information Name डालें",
      "err"
    );

    return;
  }


  if(!columns){

    showMsg(
      "msg",
      "Columns डालें",
      "err"
    );

    return;
  }


  if(!schools){

    showMsg(
      "msg",
      "School Names डालें",
      "err"
    );

    return;
  }


  showMsg(
    "msg",
    "Form बनाया जा रहा है...",
    "info"
  );


  apiCall({

    action:"createInfoForm",

    pin:pin,

    infoName:infoName,

    columns:columns,

    schools:schools

  },function(data){

    if(!data || !data.ok){

      showMsg(
        "msg",
        "Error: " +
        (data && data.error
          ? data.error
          : "Unknown error"),
        "err"
      );

      return;
    }


    CURRENT_FORM_ID =
      data.formId;


    loadForm(CURRENT_FORM_ID);

  });

}


/* =================================================
   GET FORM
================================================= */

function loadForm(formId){

  showMsg(
    "msg",
    "Information form तैयार किया जा रहा है...",
    "info"
  );


  apiCall({

    action:"getInfoForm",

    formId:formId

  },function(data){

    if(!data || !data.ok){

      showMsg(
        "msg",
        "Form load नहीं हुआ: " +
        (data && data.error
          ? data.error
          : "Unknown error"),
        "err"
      );

      return;
    }


    CURRENT_FORM =
      data.form;


    buildTable(
      CURRENT_FORM
    );


    document.getElementById(
      "entryCard"
    ).classList.remove("hidden");


    document.getElementById(
      "formTitle"
    ).innerText =
      "📋 " +
      CURRENT_FORM.infoName;


    document.getElementById(
      "schoolCount"
    ).innerText =
      CURRENT_FORM.schools.length;


    showMsg(
      "msg",
      "Form तैयार है। अब प्रत्येक School के सामने information भरें।",
      "ok"
    );

  });

}


/* =================================================
   BUILD TABLE
================================================= */

function buildTable(form){

  const table =
    document.getElementById(
      "entryTable"
    );


  const thead =
    table.querySelector("thead");

  const tbody =
    table.querySelector("tbody");


  thead.innerHTML="";

  tbody.innerHTML="";


  /* HEADER */

  const trHead =
    document.createElement("tr");


  const schoolTH =
    document.createElement("th");

  schoolTH.innerText =
    "School Name";

  trHead.appendChild(
    schoolTH
  );


  form.columns.forEach(
    function(column){

      const th =
        document.createElement("th");

      th.innerText =
        column;

      trHead.appendChild(
        th
      );

    }
  );


  thead.appendChild(
    trHead
  );


  /* SCHOOL ROWS */

  form.schools.forEach(
    function(school,schoolIndex){

      const tr =
        document.createElement("tr");


      const tdSchool =
        document.createElement("td");

      tdSchool.innerText =
        school;

      tr.appendChild(
        tdSchool
      );


      form.columns.forEach(
        function(column,columnIndex){

          const td =
            document.createElement("td");


          const input =
            document.createElement("input");

          input.type="text";

          input.placeholder =
            "भरें";


          input.dataset.school =
            school;

          input.dataset.column =
            column;


          input.dataset.schoolIndex =
            schoolIndex;

          input.dataset.columnIndex =
            columnIndex;


          td.appendChild(
            input
          );


          tr.appendChild(
            td
          );

        }
      );


      tbody.appendChild(
        tr
      );

    }
  );

}


/* =================================================
   COLLECT DATA
================================================= */

function collectData(){

  const rows=[];


  if(!CURRENT_FORM){
    return rows;
  }


  const trs =
    document.querySelectorAll(
      "#entryTable tbody tr"
    );


  trs.forEach(
    function(tr,index){

      const inputs =
        tr.querySelectorAll(
          "input"
        );


      const values=[];

      let hasValue=false;


      inputs.forEach(
        function(input){

          const value =
            input.value.trim();

          values.push(
            value
          );


          if(value!==""){
            hasValue=true;
          }

        }
      );


      if(hasValue){

        rows.push({

          school:
            CURRENT_FORM.schools[index],

          values:
            values

        });

      }

    }
  );


  return rows;
}


/* =================================================
   SUBMIT
================================================= */

function submitInformation(){

  if(!CURRENT_FORM){

    alert(
      "पहले Information Form बनाएं।"
    );

    return;
  }


  const data =
    collectData();


  if(!data.length){

    showMsg(
      "saveMsg",
      "कम से कम एक School की information भरें।",
      "err"
    );

    return;
  }


  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  showMsg(
    "saveMsg",
    "Google Sheet में save किया जा रहा है...",
    "info"
  );


  apiCall({

    action:"submitInfo",

    pin:pin,

    formId:
      CURRENT_FORM_ID,

    data:
      JSON.stringify(data)

  },function(result){

    if(!result || !result.ok){

      showMsg(
        "saveMsg",
        "Save Error: " +
        (result && result.error
          ? result.error
          : "Unknown error"),
        "err"
      );

      return;
    }


    showMsg(
      "saveMsg",
      "✅ सभी information Google Sheet में save हो गई।",
      "ok"
    );

  });

}


/* =================================================
   PRINT
================================================= */

function printTable(){

  if(!CURRENT_FORM){
    return;
  }


  const table =
    document.getElementById(
      "entryTable"
    );


  const printWindow =
    window.open(
      "",
      "_blank"
    );


  printWindow.document.write(`
<!doctype html>
<html lang="hi">

<head>

<meta charset="utf-8">

<title>${escapeHTML(CURRENT_FORM.infoName)}</title>

<style>

body{
  font-family:Arial,sans-serif;
  padding:20px;
}

h2{
  text-align:center;
}

table{
  border-collapse:collapse;
  width:100%;
}

th,td{
  border:1px solid #000;
  padding:7px;
}

th{
  background:#eee;
}

input{
  border:0;
  width:100%;
  font-size:14px;
}

@media print{
  input{
    border:0;
  }
}

</style>

</head>

<body>

<h2>${escapeHTML(CURRENT_FORM.infoName)}</h2>

${table.outerHTML}

</body>

</html>
`);


  printWindow.document.close();

  setTimeout(
    function(){

      printWindow.focus();

      printWindow.print();

    },
    500
  );

}


/* =================================================
   HTML ESCAPE
================================================= */

function escapeHTML(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
