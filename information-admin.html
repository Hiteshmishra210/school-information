<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Information Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fa;
  color:#1f2937;
}

.wrap{
  max-width:900px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 4px 18px #0002;
}

h1{
  margin-top:0;
  color:#1d4ed8;
}

h2{
  margin-top:25px;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 6px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

textarea{
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  margin-top:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:hover{
  opacity:.9;
}

.green{
  background:#16a34a;
}

.orange{
  background:#ea580c;
}

.gray{
  background:#64748b;
}

.red{
  background:#dc2626;
}

.msg{
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  display:none;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

.hidden{
  display:none;
}

.schoolBox{
  margin-top:20px;
  padding:18px;
  border:1px solid #dbe3ee;
  border-radius:12px;
  background:#f8fafc;
}

.schoolTitle{
  font-size:20px;
  font-weight:bold;
  color:#1d4ed8;
  margin-bottom:15px;
}

.progress{
  margin-top:10px;
  font-size:14px;
  color:#475569;
}

.entry{
  margin-bottom:15px;
}

.entry label{
  margin-top:0;
}

.topInfo{
  background:#eff6ff;
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.summary{
  margin-top:20px;
  padding:15px;
  background:#f8fafc;
  border-radius:10px;
}

.summaryRow{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #e2e8f0;
}

@media(max-width:600px){

  .wrap{
    margin:0;
    padding:8px;
  }

  .card{
    padding:16px;
    border-radius:10px;
  }

  button{
    width:100%;
  }

}

</style>
</head>


<body>

<div class="wrap">

<div class="card">

<h1>📋 Information Admin</h1>

<div id="msg" class="msg"></div>


<!-- ================================================= -->
<!-- CREATE FORM -->
<!-- ================================================= -->

<div id="createSection">

<label>Admin PIN</label>

<input
  id="pin"
  type="password"
  value="1234"
  placeholder="Admin PIN">


<label>Information Name</label>

<input
  id="infoName"
  type="text"
  placeholder="जैसे: Topper Information">


<label>Column Names</label>

<textarea
  id="columns"
  rows="8"
  placeholder="Student Name
Father Name
Class
Marks
Percentage"></textarea>


<label>School Names</label>

<textarea
  id="schools"
  rows="10"
  placeholder="School 1
School 2
School 3
School 4"></textarea>


<button onclick="createForm()">
➕ Create Information Form
</button>

</div>



<!-- ================================================= -->
<!-- FORM ENTRY -->
<!-- ================================================= -->

<div id="entrySection" class="hidden">

<div class="topInfo">

<div>
<b>Information:</b>
<span id="showInfoName"></span>
</div>

<div class="progress">
School <span id="currentSchoolNo">1</span>
of
<span id="totalSchools">0</span>
</div>

</div>


<div id="schoolBox" class="schoolBox">

<div class="schoolTitle">
<span id="schoolName"></span>
</div>

<div id="fields"></div>

<div class="actions">

<button
  class="green"
  onclick="saveNext()">
💾 Save & Next School
</button>

<button
  class="gray"
  onclick="previousSchool()">
⬅ Previous
</button>

</div>

</div>


<div class="summary">

<h3>School Progress</h3>

<div id="summaryList"></div>

</div>


<div class="actions">

<button
  class="green"
  onclick="submitAll()">
✅ Submit All Information
</button>

<button
  class="orange"
  onclick="printPreview()">
🖨 Print
</button>

</div>

</div>


</div>

</div>



<script>


// =====================================================
// API
// =====================================================

const API =
"https://script.google.com/macros/s/AKfycbxl6YqPsCsJf9fvpnU9P5SGtDN9LRoMF6rYI0aaUQstF17nTsGUvCj5KnqqKWYsilUj/exec";


// =====================================================
// VARIABLES
// =====================================================

let formId = "";

let formData = null;

let currentSchool = 0;

let allData = [];

let jsonpCounter = 0;


// =====================================================
// MESSAGE
// =====================================================

function showMsg(text,type){

  const box =
    document.getElementById("msg");

  box.className =
    "msg " + type;

  box.innerText =
    text;

}


// =====================================================
// JSONP API
// =====================================================

function apiCall(params){

  return new Promise(
    function(resolve,reject){

      const callbackName =
        "apiCallback_" +
        Date.now() +
        "_" +
        (++jsonpCounter);


      params.callback =
        callbackName;


      const query =
        Object.keys(params)
          .map(
            function(key){

              return (
                encodeURIComponent(key) +
                "=" +
                encodeURIComponent(
                  params[key]
                )
              );

            }
          )
          .join("&");


      const script =
        document.createElement("script");


      const timeout =
        setTimeout(
          function(){

            cleanup();

            reject(
              new Error(
                "Google API response नहीं आया"
              )
            );

          },
          20000
        );


      window[callbackName] =
        function(data){

          clearTimeout(timeout);

          cleanup();

          resolve(data);

        };


      function cleanup(){

        try{
          delete window[callbackName];
        }catch(e){}

        if(script.parentNode){
          script.parentNode.removeChild(script);
        }

      }


      script.onerror =
        function(){

          clearTimeout(timeout);

          cleanup();

          reject(
            new Error(
              "Google API connection failed"
            )
          );

        };


      script.src =
        API +
        "?" +
        query;


      document.body.appendChild(
        script
      );

    }
  );

}



// =====================================================
// CREATE FORM
// =====================================================

async function createForm(){

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  const infoName =
    document
      .getElementById("infoName")
      .value
      .trim();


  const columns =
    document
      .getElementById("columns")
      .value
      .trim();


  const schools =
    document
      .getElementById("schools")
      .value
      .trim();


  if(!pin){

    showMsg(
      "Admin PIN डालें",
      "error"
    );

    return;

  }


  if(!infoName){

    showMsg(
      "Information Name डालें",
      "error"
    );

    return;

  }


  if(!columns){

    showMsg(
      "Column Names डालें",
      "error"
    );

    return;

  }


  if(!schools){

    showMsg(
      "School Names डालें",
      "error"
    );

    return;

  }


  showMsg(
    "Information Form बनाया जा रहा है...",
    "info"
  );


  try{

    const result =
      await apiCall({

        action:
          "createInfoForm",

        pin:
          pin,

        infoName:
          infoName,

        columns:
          columns,

        schools:
          schools

      });


    if(!result || !result.ok){

      throw new Error(
        result &&
        result.error
          ? result.error
          : "Form create नहीं हुआ"
      );

    }


    formId =
      result.formId;


    await loadForm();


  }

  catch(error){

    showMsg(
      "Error: " +
      error.message,
      "error"
    );

  }

}



// =====================================================
// LOAD FORM
// =====================================================

async function loadForm(){

  showMsg(
    "Form information लोड हो रही है...",
    "info"
  );


  try{

    const result =
      await apiCall({

        action:
          "getInfoForm",

        formId:
          formId

      });


    if(!result || !result.ok){

      throw new Error(
        result &&
        result.error
          ? result.error
          : "Form नहीं मिला"
      );

    }


    formData =
      result.form;


    allData =
      formData.schools.map(
        function(school){

          return {

            school:
              school,

            values:
              formData.columns.map(
                function(){

                  return "";

                }
              )

          };

        }
      );


    currentSchool = 0;


    document
      .getElementById(
        "createSection"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "entrySection"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "showInfoName"
      )
      .innerText =
      formData.infoName;


    document
      .getElementById(
        "totalSchools"
      )
      .innerText =
      formData.schools.length;


    renderSchool();

    updateSummary();


    showMsg(
      "Form तैयार है। अब School की information भरें।",
      "success"
    );

  }

  catch(error){

    showMsg(
      "Error: " +
      error.message,
      "error"
    );

  }

}



// =====================================================
// RENDER SCHOOL
// =====================================================

function renderSchool(){

  const school =
    formData.schools[
      currentSchool
    ];


  document
    .getElementById(
      "schoolName"
    )
    .innerText =
    school;


  document
    .getElementById(
      "currentSchoolNo"
    )
    .innerText =
    currentSchool + 1;


  const fields =
    document
      .getElementById(
        "fields"
      );


  fields.innerHTML =
    "";


  const saved =
    allData[currentSchool]
      .values;


  formData.columns.forEach(
    function(column,index){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "entry";


      const label =
        document.createElement(
          "label"
        );


      label.innerText =
        column;


      const input =
        document.createElement(
          "input"
        );


      input.type =
        "text";


      input.dataset.index =
        index;


      input.value =
        saved[index] || "";


      input.placeholder =
        column;


      div.appendChild(
        label
      );


      div.appendChild(
        input
      );


      fields.appendChild(
        div
      );

    }
  );

}



// =====================================================
// SAVE CURRENT SCHOOL
// =====================================================

function saveCurrentSchool(){

  const inputs =
    document.querySelectorAll(
      "#fields input"
    );


  const values =
    [];


  inputs.forEach(
    function(input){

      values.push(
        input.value.trim()
      );

    }
  );


  allData[currentSchool]
    .values =
    values;

}



// =====================================================
// SAVE & NEXT
// =====================================================

function saveNext(){

  saveCurrentSchool();


  if(
    currentSchool <
    formData.schools.length - 1
  ){

    currentSchool++;

    renderSchool();

    updateSummary();

    showMsg(
      "अगले School पर चले गए।",
      "success"
    );

  }

  else{

    updateSummary();

    showMsg(
      "सभी Schools की entry पूरी हो गई। अब Submit All कर सकते हैं।",
      "success"
    );

  }

}



// =====================================================
// PREVIOUS
// =====================================================

function previousSchool(){

  saveCurrentSchool();


  if(currentSchool > 0){

    currentSchool--;

    renderSchool();

    updateSummary();

  }

}



// =====================================================
// SUMMARY
// =====================================================

function updateSummary(){

  const box =
    document.getElementById(
      "summaryList"
    );


  box.innerHTML =
    "";


  allData.forEach(
    function(row,index){

      const filled =
        row.values.some(
          function(value){

            return String(
              value || ""
            ).trim() !== "";

          }
        );


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "summaryRow";


      const name =
        document.createElement(
          "span"
        );


      name.innerText =
        row.school;


      const status =
        document.createElement(
          "span"
        );


      status.innerText =
        filled
          ? "✅ Information भरी गई"
          : "⏳ बाकी";


      div.appendChild(
        name
      );


      div.appendChild(
        status
      );


      box.appendChild(
        div
      );

    }
  );

}



// =====================================================
// SUBMIT ALL
// =====================================================

async function submitAll(){

  saveCurrentSchool();

  updateSummary();


  const hasAny =
    allData.some(
      function(row){

        return row.values.some(
          function(value){

            return String(
              value || ""
            ).trim() !== "";

          }
        );

      }
    );


  if(!hasAny){

    showMsg(
      "कम से कम एक School की information भरें।",
      "error"
    );

    return;

  }


  const pin =
    document
      .getElementById(
        "pin"
      )
      .value
      .trim();


  if(!pin){

    showMsg(
      "Admin PIN missing है।",
      "error"
    );

    return;

  }


  if(
    !confirm(
      "क्या सभी information Google Sheet में Submit करनी है?"
    )
  ){

    return;

  }


  showMsg(
    "Information Google Sheet में save हो रही है...",
    "info"
  );


  try{

    const result =
      await apiCall({

        action:
          "submitInfo",

        pin:
          pin,

        formId:
          formId,

        data:
          JSON.stringify(
            allData
          )

      });


    if(!result || !result.ok){

      throw new Error(
        result &&
        result.error
          ? result.error
          : "Submit failed"
      );

    }


    showMsg(
      "✅ सभी information Google Sheet में save हो गई।",
      "success"
    );


    alert(
      "सभी information successfully Google Sheet में save हो गई।"
    );

  }

  catch(error){

    showMsg(
      "Submit Error: " +
      error.message,
      "error"
    );

  }

}



// =====================================================
// PRINT
// =====================================================

function printPreview(){

  saveCurrentSchool();


  if(!formData){

    return;

  }


  let html = "";

  html +=
    "<html><head><title>" +
    escapeHtml(
      formData.infoName
    ) +
    "</title>";


  html +=
    "<style>" +

    "body{font-family:Arial;padding:20px;}" +

    "h1{text-align:center;}" +

    "table{width:100%;border-collapse:collapse;margin-top:20px;}" +

    "th,td{border:1px solid #333;padding:8px;text-align:left;}" +

    "th{font-weight:bold;}" +

    "@media print{button{display:none;}}" +

    "</style>";

  html +=
    "</head><body>";


  html +=
    "<h1>" +
    escapeHtml(
      formData.infoName
    ) +
    "</h1>";


  html +=
    "<table>";


  html +=
    "<tr><th>School Name</th>";


  formData.columns.forEach(
    function(column){

      html +=
        "<th>" +
        escapeHtml(
          column
        ) +
        "</th>";

    }
  );


  html +=
    "</tr>";


  allData.forEach(
    function(row){

      html +=
        "<tr>";


      html +=
        "<td>" +
        escapeHtml(
          row.school
        ) +
        "</td>";


      formData.columns.forEach(
        function(_,index){

          html +=
            "<td>" +
            escapeHtml(
              row.values[index] || ""
            ) +
            "</td>";

        }
      );


      html +=
        "</tr>";

    }
  );


  html +=
    "</table>";


  html +=
    "<br><button onclick='window.print()'>Print</button>";


  html +=
    "</body></html>";


  const win =
    window.open(
      "",
      "_blank"
    );


  if(!win){

    alert(
      "Popup blocked है। Browser में popup allow करें।"
    );

    return;

  }


  win.document.write(
    html
  );


  win.document.close();

}



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>
</html>
