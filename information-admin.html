<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  color:#17202a;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px #0001;
}

label{
  font-weight:700;
  display:block;
  margin:10px 0 6px;
}

select,input{
  width:100%;
  padding:10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:650px;
}

th,td{
  border:1px solid #d7dee8;
  padding:7px;
}

th{
  background:#eef3f8;
  text-align:left;
}

.scroll{
  overflow:auto;
}

.btn{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  margin:4px;
  cursor:pointer;
  font-size:15px;
}

.blue{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.gray{
  background:#e2e8f0;
  color:#111;
}

.red{
  background:#dc2626;
  color:#fff;
}

.hidden{
  display:none;
}

.msg{
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

@media(max-width:600px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:14px;
    border-radius:10px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:19px;
  }

  .btn{
    width:100%;
    margin:4px 0;
  }
}

@media print{

  .no-print{
    display:none!important;
  }

  body{
    background:#fff;
  }

  .card{
    box-shadow:none;
    padding:0;
  }

  .wrap{
    margin:0;
    max-width:none;
  }

  input{
    border:0;
    padding:2px;
  }

  select{
    border:0;
    appearance:none;
    padding:2px;
  }
}
</style>

</head>

<body>

<div class="wrap">

<div class="card">

<h1 id="title">Loading...</h1>

<label>School Name</label>

<select id="school">
<option value="">-- अपना School Select करें --</option>
</select>

<div id="area" class="hidden">

<h2 id="schoolTitle"></h2>

<div class="scroll">

<table>

<thead id="head"></thead>

<tbody id="body"></tbody>

</table>

</div>

<div class="no-print">

<button class="btn blue" onclick="addRow()">
➕ Add Row
</button>

<button class="btn green" onclick="submitForm()">
☁️ Submit
</button>

<button class="btn gray" onclick="printSchool()">
🖨️ Print This School
</button>

</div>

<div id="msg"></div>

</div>

</div>

</div>


<script>

/* ==========================================
   GOOGLE APPS SCRIPT API
   ========================================== */

const API =
"https://script.google.com/macros/s/AKfycbyHb8abCXCQFAhemdCEcoHEo2gx3JL5eq_-X558SQITZXOiJ_ocCnVymLItAB2m2Pr5/exec";


/* ==========================================
   FORM ID
   ========================================== */

const formId =
new URLSearchParams(window.location.search).get("form");


/* ==========================================
   VARIABLES
   ========================================== */

let cfg = null;
let rows = [];


/* ==========================================
   SHORT ID
   ========================================== */

const $ = id =>
document.getElementById(id);


/* ==========================================
   ESCAPE HTML
   ========================================== */

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    }
  );

}


/* ==========================================
   API CALL
   ========================================== */

async function apiCall(action, params = {}){

  let url =
    API +
    "?action=" +
    encodeURIComponent(action);

  Object.keys(params).forEach(function(key){

    url +=
      "&" +
      encodeURIComponent(key) +
      "=" +
      encodeURIComponent(params[key]);

  });


  try{

    const response =
      await fetch(
        url,
        {
          method:"GET",
          redirect:"follow",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Google API HTTP Error: " +
        response.status
      );

    }


    const text =
      await response.text();


    if(!text){

      throw new Error(
        "Google API ने खाली response दिया"
      );

    }


    let data;

    try{

      data =
        JSON.parse(text);

    }
    catch(e){

      console.log("API RESPONSE:",text);

      throw new Error(
        "Google API का response JSON नहीं है"
      );

    }


    return data;

  }
  catch(error){

    console.error(
      "API ERROR:",
      error
    );

    throw error;

  }

}


/* ==========================================
   LOAD FORM
   ========================================== */

async function load(){

  $("msg").className =
    "msg loading";

  $("msg").textContent =
    "Form information load हो रही है...";


  try{

    if(!formId){

      throw new Error(
        "Form link में form ID नहीं है"
      );

    }


    console.log(
      "FORM ID:",
      formId
    );


    const data =
      await apiCall(
        "getForm",
        {
          formId:formId
        }
      );


    console.log(
      "FORM RESPONSE:",
      data
    );


    if(!data || !data.ok){

      throw new Error(
        data && data.error
          ? data.error
          : "Form नहीं मिला"
      );

    }


    if(
      !data.form
    ){

      throw new Error(
        "Form data प्राप्त नहीं हुआ"
      );

    }


    cfg =
      data.form;


    /* ======================================
       FORM NAME
       ====================================== */

    $("title").textContent =
      cfg.name || "School Information";


    /* ======================================
       SCHOOL LIST
       ====================================== */

    if(
      !Array.isArray(cfg.schools)
    ){

      throw new Error(
        "School list प्राप्त नहीं हुई"
      );

    }


    if(
      cfg.schools.length === 0
    ){

      throw new Error(
        "इस Form में कोई School नहीं है"
      );

    }


    $("school").innerHTML =
      '<option value="">-- अपना School Select करें --</option>' +

      cfg.schools
        .map(function(s){

          return (
            '<option value="' +
            esc(s) +
            '">' +
            esc(s) +
            '</option>'
          );

        })
        .join("");


    $("msg").className =
      "msg ok";

    $("msg").textContent =
      "✓ Form और School List load हो गई।";


  }
  catch(error){

    console.error(
      error
    );


    $("title").textContent =
      "Form Load Error";


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;

  }

}


/* ==========================================
   SCHOOL SELECT
   ========================================== */

$("school").onchange =
function(){

  if(!this.value){

    $("area")
      .classList
      .add("hidden");

    $("msg").className =
      "";

    $("msg").textContent =
      "";

    return;

  }


  $("schoolTitle")
    .textContent =
    this.value;


  rows = [
    Array(
      cfg.columns.length
    ).fill("")
  ];


  render();


  $("area")
    .classList
    .remove("hidden");


  $("msg").className =
    "";

  $("msg").textContent =
    "";

};


/* ==========================================
   RENDER TABLE
   ========================================== */

function render(){

  if(!cfg) return;


  $("head").innerHTML =
    "<tr>" +

    cfg.columns
      .map(function(c){

        return (
          "<th>" +
          esc(c) +
          "</th>"
        );

      })
      .join("") +

    '<th class="no-print">Delete</th>' +

    "</tr>";


  $("body").innerHTML =

    rows
      .map(function(r,i){

        return (

          "<tr>" +

          r
            .map(function(v,j){

              return (

                "<td>" +

                '<input value="' +
                esc(v || "") +
                '" ' +

                'oninput="rows[' +
                i +
                "][" +
                j +
                ']=this.value">' +

                "</td>"

              );

            })
            .join("") +

          '<td class="no-print">' +

          '<button class="btn red" ' +
          'onclick="delRow(' +
          i +
          ')">' +

          "🗑️" +

          "</button>" +

          "</td>" +

          "</tr>"

        );

      })
      .join("");

}


/* ==========================================
   ADD ROW
   ========================================== */

function addRow(){

  if(!cfg) return;


  rows.push(
    Array(
      cfg.columns.length
    ).fill("")
  );


  render();

}


/* ==========================================
   DELETE ROW
   ========================================== */

function delRow(i){

  if(rows.length > 1){

    rows.splice(
      i,
      1
    );

  }
  else{

    rows[0] =
      Array(
        cfg.columns.length
      ).fill("");

  }


  render();

}


/* ==========================================
   SUBMIT FORM
   ========================================== */

async function submitForm(){

  const school =
    $("school").value;


  if(!school){

    alert(
      "पहले School Select करें"
    );

    return;

  }


  const data =
    rows.filter(function(r){

      return r.some(function(v){

        return String(v).trim() !== "";

      });

    });


  if(!data.length){

    alert(
      "कम से कम एक row भरें"
    );

    return;

  }


  try{

    $("msg").className =
      "msg loading";

    $("msg").textContent =
      "Google Sheet में save हो रहा है...";


    const result =
      await apiCall(
        "submit",
        {
          formId:formId,

          school:school,

          rows:JSON.stringify(data)
        }
      );


    console.log(
      "SUBMIT RESPONSE:",
      result
    );


    if(
      !result ||
      !result.ok
    ){

      throw new Error(
        result && result.error
          ? result.error
          : "Save नहीं हुआ"
      );

    }


    $("msg").className =
      "msg ok";


    $("msg").textContent =
      "✓ " +
      result.count +
      " row Google Sheet में save हो गई।";


  }
  catch(error){

    console.error(
      error
    );


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;

  }

}


/* ==========================================
   PRINT
   ========================================== */

function printSchool(){

  window.print();

}


/* ==========================================
   START
   ========================================== */

load();

</script>

</body>
</html>
